services:
  xui-bot:
    build: .
    container_name: xui-telegram-bot
    restart: always
    network_mode: "host"
    env_file:
      - .env
    volumes:
      # ذخیره دائمی دیتابیس کاربران و کش دامنه کلودفلر
      - ./data:/app/data
      # دسترسی به لاگ‌های سیستم‌عامل و ژورنال برای خواندن خودکار دامنه کلودفلر
      - /var/log:/var/log:ro
      - /run/log:/run/log:ro
      - /etc/machine-id:/etc/machine-id:ro
      # اشتراک فایل‌های دامنه و دیتابیس پنل با سرور
      - /etc/x-ui:/etc/x-ui
    environment:
      - TZ=Asia/Tehran
      - DB_PATH=/app/data/bot_data.db
